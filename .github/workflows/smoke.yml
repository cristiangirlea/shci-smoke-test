name: smoke

# The smoke target for self-hosted-ci releases: `make smoke TAG=<tag>` in infra brings up a runner set
# for this repository from a fresh clone of that tag, triggers this workflow, waits for it, and
# removes the runner set again. Between tests no runner exists, so a push here just stays queued.
on: [workflow_dispatch]

jobs:
  smoke:
    runs-on: lab-shci-smoke-test
    steps:
      - run: |
          echo "runner: $RUNNER_NAME"
          uname -a
          docker version --format 'docker {{.Server.Version}}'
