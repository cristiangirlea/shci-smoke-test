name: smoke

# The smoke target for self-hosted-ci releases: `make smoke TAG=<tag>` in infra brings up a runner set
# for this repository from a fresh clone of that tag, triggers this workflow, waits for it, and
# removes the runner set again. Between tests no runner exists, so a push here just stays queued.
on: [workflow_dispatch]

jobs:
  smoke:
    runs-on: lab-shci-smoke-test
    env:
      # The cluster's registry, plain HTTP, the same name the nodes pull by.
      REGISTRY: registry.localhost:5000
      ACCEPT: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json
    steps:
      - run: |
          echo "runner: $RUNNER_NAME"
          uname -a
          docker version --format 'docker {{.Server.Version}}'

      # Docker's own builder: build, push, then pull back by the digest the registry reports. The
      # image is FROM scratch, so nothing comes from Docker Hub; each run adds one tiny tag.
      - name: push with docker build
        run: |
          mkdir ctx && echo "$GITHUB_RUN_ID" > ctx/run
          printf 'FROM scratch\nCOPY run /run\n' > ctx/Dockerfile
          tag="$REGISTRY/shci-smoke:run-$GITHUB_RUN_ID"
          docker build -t "$tag" ctx
          docker push "$tag"
          digest=$(curl -fsSI -H "Accept: $ACCEPT" "http://$REGISTRY/v2/shci-smoke/manifests/run-$GITHUB_RUN_ID" | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')
          test -n "$digest" || { echo "the registry does not have $tag"; exit 1; }
          docker rmi "$tag"
          docker pull "$REGISTRY/shci-smoke@$digest"
          echo "pushed and pulled back $tag ($digest)"

      # A docker-container builder (setup-buildx-action's default) runs its own BuildKit, which needs
      # the registry declared plain HTTP, exactly as self-hosted-ci's README shows.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."registry.localhost:5000"]
              http = true
      - name: build FROM the registry and push through BuildKit
        run: |
          printf 'FROM %s\nCOPY run /run2\n' "$REGISTRY/shci-smoke:run-$GITHUB_RUN_ID" > ctx/Dockerfile.buildx
          docker buildx build --push -f ctx/Dockerfile.buildx -t "$REGISTRY/shci-smoke:run-$GITHUB_RUN_ID-buildx" ctx
          curl -fsSI -H "Accept: $ACCEPT" "http://$REGISTRY/v2/shci-smoke/manifests/run-$GITHUB_RUN_ID-buildx" | tr -d '\r' | grep -i '^docker-content-digest:'
